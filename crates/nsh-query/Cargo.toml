[package]
name = "nsh-query"
description = "TanStack Query-style async state for Native Shell Rust apps, on the gpui-query core state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
persist = ["dep:serde", "dep:serde_json"]
http-cache = ["dep:gpui-query-http"]

[dependencies]
gpui-query = { version = "0.3.1", default-features = false, features = ["core"] }
nsh-core = "0.5.0"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
gpui-query-http = { version = "0.1", optional = true }

[dev-dependencies]
bytes = "1"
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
